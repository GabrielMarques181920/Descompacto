<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="4 Paredes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b0c18"/>
      <stop offset="0.55" stop-color="#1a060c"/>
      <stop offset="1" stop-color="#0a090a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6cd84"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <linearGradient id="fire" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.5" stop-color="#ff9f1c"/>
      <stop offset="1" stop-color="#e5401f"/>
    </linearGradient>
    <linearGradient id="water" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#d9f4ff"/>
      <stop offset="0.55" stop-color="#6fd4f7"/>
      <stop offset="1" stop-color="#1f8fd0"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="url(#gold)" stroke-opacity="0.45" stroke-width="6"/>

  <!-- as 4 paredes -->
  <rect x="100" y="100" width="312" height="312" rx="46" fill="none" stroke="#f6f2f1" stroke-opacity="0.92" stroke-width="16"/>

  <!-- o casal: fogo e água, dentro do quarto -->
  <g transform="translate(0,16)">
    <!-- Chispa (fogo) -->
    <path d="M204 148 C234 188 256 204 256 240 a52 52 0 0 1 -104 0 C152 204 174 188 204 148 Z" fill="url(#fire)"/>
    <path d="M204 208 C216 224 224 232 224 244 a20 20 0 0 1 -40 0 c0 -12 8 -20 20 -36 Z" fill="#ffe27a" opacity=".9"/>
    <!-- Gota (água) -->
    <path d="M312 148 C312 148 372 232 372 268 a60 60 0 0 1 -120 0 C252 232 312 148 312 148 Z" fill="url(#water)"/>
    <ellipse cx="288" cy="252" rx="10" ry="22" fill="#fff" opacity=".5" transform="rotate(-16 288 252)"/>
  </g>
</svg>
