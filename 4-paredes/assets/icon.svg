<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="4 Paredes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b0c18"/>
      <stop offset="0.55" stop-color="#1a060c"/>
      <stop offset="1" stop-color="#0a090a"/>
    </linearGradient>
    <linearGradient id="flame" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#c4506a"/>
      <stop offset="0.5" stop-color="#8c1c39"/>
      <stop offset="1" stop-color="#3b0c18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6cd84"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="url(#gold)" stroke-opacity="0.45" stroke-width="6"/>

  <!-- as 4 paredes -->
  <rect x="104" y="104" width="304" height="304" rx="46" fill="none" stroke="#f6f2f1" stroke-opacity="0.92" stroke-width="16"/>

  <!-- a chama dentro do quarto -->
  <g transform="translate(156,150) scale(8.33)">
    <path d="M12 2.6c3.6 4.1 6.2 6.5 6.2 9.9A6.2 6.2 0 0 1 5.8 12.5c0-3.4 2.6-5.8 6.2-9.9Z" fill="url(#flame)"/>
    <path d="M12 9.4c1.5 1.8 2.5 2.7 2.5 4.2a2.5 2.5 0 1 1-5 0c0-1.5 1-2.4 2.5-4.2Z" fill="url(#gold)"/>
  </g>
</svg>
